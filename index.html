<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Catat reps tiap alat, pantau kenaikan beban, dan timer istirahat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface2:#E3EBED; --ink:#122024; --muted:#5A6E73; --line:#D8E2E4; --track:#DCE6E8;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#D6EDEF;
  --ok:#2A8A57; --ok-bg:#DDF1E5; --ok-ink:#1E6B41;
  --up:#D9822B; --up-bg:#FADFC0; --up-ink:#8A4B08;
  --low:#C8402E; --low-bg:#F7DDD7; --low-ink:#A93323;
  --skip:#7A5AC8; --skip-bg:#ECE6FA; --skip-ink:#5A3FA8; --done-bg:#EAF6EE; --todo:#B4C4C7;
  --shadow:0 1px 2px rgba(18,32,36,.05),0 10px 28px rgba(18,32,36,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1416; --surface:#162023; --surface2:#1F2C30; --ink:#E4EEF0; --muted:#8FA5AA; --line:#26363A; --track:#26363A;
    --accent:#4CC9D3; --accent-ink:#06282B; --accent-soft:#12363A;
    --ok:#58C98A; --ok-bg:#153A26; --ok-ink:#8BE0AF;
    --up:#F0A55A; --up-bg:#42290F; --up-ink:#F5C48C;
    --low:#EE7A66; --low-bg:#3E1E18; --low-ink:#F4A191;
    --skip:#B39CF0; --skip-bg:#2A2244; --skip-ink:#CDBDF7; --done-bg:#12281C; --todo:#46595E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#162023; --surface2:#1F2C30; --ink:#E4EEF0; --muted:#8FA5AA; --line:#26363A; --track:#26363A;
  --accent:#4CC9D3; --accent-ink:#06282B; --accent-soft:#12363A;
  --ok:#58C98A; --ok-bg:#153A26; --ok-ink:#8BE0AF;
  --up:#F0A55A; --up-bg:#42290F; --up-ink:#F5C48C;
  --low:#EE7A66; --low-bg:#3E1E18; --low-ink:#F4A191;
  --skip:#B39CF0; --skip-bg:#2A2244; --skip-ink:#CDBDF7; --done-bg:#12281C; --todo:#46595E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);padding-inline:env(safe-area-inset-left) env(safe-area-inset-right);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
#shell{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;background:var(--bg);padding-top:env(safe-area-inset-top);z-index:20}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font:700 22px/1.2 var(--font-num);letter-spacing:-.01em}
.brand>div:first-child{flex:1;min-width:0}
.sbadge{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font:700 14px var(--font-num);background:var(--ok-bg);color:var(--ok-ink);cursor:pointer}
.sbadge.near{background:var(--up-bg);color:var(--up-ink)}
.sbadge.over{background:var(--low-bg);color:var(--low-ink)}
.brand small{display:block;font:500 12px/1.3 var(--font);color:var(--muted)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.app{max-width:560px;margin:0 auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:12px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;width:100%;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));position:relative;z-index:30}
.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--accent)}
.kb .tabs{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .dl{min-width:0;text-align:left;border:0;background:none;padding:0;color:var(--ink);font:inherit}
.dayrow .dl b{display:block;font-weight:650}
.dayrow .dl small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .seg button{padding:9px 6px;font-size:14px}
.dayrow .seg button[data-v="gym"][aria-pressed="true"]{background:var(--done-bg);color:var(--ok-ink)}
.dayrow .seg button[data-v="rest"][aria-pressed="true"]{background:var(--skip-bg);color:var(--skip-ink)}
.dayrow .seg button:disabled{opacity:.4}
.dayhead{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;background:var(--surface2);border-radius:12px}
.seg button{border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px}
.stepper .iconbtn{flex:none;width:38px;height:38px;border-radius:50%}
.stepper .lab{flex:1;min-width:0;position:relative;text-align:center;font-weight:650;padding:6px 4px}
.stepper .lab input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent)}
.prog{margin-top:10px}
.prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .4s ease}

/* baris latihan */
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.wrow+.wrow{border-top:1px solid var(--line)}
.wrow.hidden-ex{opacity:.55}
.whead{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.whead:active{background:var(--surface2)}
.no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font:700 12px var(--font-num);color:var(--muted)}
.wrow{box-shadow:inset 4px 0 0 var(--todo)}
.wrow .no{background:transparent;border:1.5px solid var(--todo);color:var(--muted)}
.wrow.done{background:var(--done-bg);box-shadow:inset 4px 0 0 var(--ok)}
.wrow.done .no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.wrow.skipped{background:var(--skip-bg);box-shadow:inset 4px 0 0 var(--skip)}
.wrow.skipped .no{background:transparent;border:1.5px dashed var(--skip);color:var(--skip-ink)}
.tw{position:relative;flex:none;width:60px;height:60px}
.tw img{display:block;width:60px;height:60px;object-fit:cover;border-radius:12px;background:var(--surface2)}
.tw .no{position:absolute;left:-6px;top:-6px;width:22px;height:22px;font-size:11px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wrow.done .tw .no{background:var(--ok);color:var(--surface)}
.wrow.skipped .tw .no{background:var(--skip-bg)}
.wrow.skipped .tw img{opacity:.5;filter:grayscale(1)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--surface2)}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:650;background:var(--surface);border:1px solid var(--line)}
.sumbar span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--todo)}
.sumbar .d{background:var(--done-bg);color:var(--ok-ink);border-color:transparent}.sumbar .d::before{background:var(--ok)}
.sumbar .k{background:var(--skip-bg);color:var(--skip-ink);border-color:transparent}.sumbar .k::before{background:var(--skip)}
.wmain{flex:1;min-width:0;display:block}
.wn{display:block;font-weight:650;line-height:1.25}
.wd{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.wmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.pos{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.wt{font-weight:700;font-size:14px}
.wnote{font-size:11px;color:var(--muted)}
.wright{flex:none;display:grid;justify-items:end;gap:4px}
.reps{font-weight:700;font-size:14px}
.chip{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 8px;border-radius:999px;font:700 12px var(--font-num);background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chip.up{background:var(--up-bg);color:var(--up-ink)}
.chip.low{background:var(--low-bg);color:var(--low-ink)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.panel{padding:2px 14px 16px;display:grid;gap:12px}
.fl{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.stp{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stp button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600;padding:0}
.stp input{height:48px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:700 22px var(--font-num);min-width:0;width:100%}
.rchips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rchips button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:700 17px var(--font-num);padding:0}
.rchips button.in{border-color:var(--ok)}
.rchips button.hi{border-color:var(--up)}
.rchips button.lo{border-color:var(--low)}
.rchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fb{margin:0;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--surface2);color:var(--ink)}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.up{background:var(--up-bg);color:var(--up-ink)}
.fb.low{background:var(--low-bg);color:var(--low-ink)}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--up-bg);color:var(--up-ink);font-size:13px}
.sug button{flex:none;border:0;border-radius:10px;padding:8px 12px;background:var(--up);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--low-ink);background:var(--low-bg);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:110px}
.empty{margin:0;padding:22px 8px;text-align:center;color:var(--muted)}
.ghead{display:flex;justify-content:space-between;gap:8px;padding:12px 4px 6px;font-size:13px;font-weight:650;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--surface2)}
.item .main{flex:1;min-width:0}
.item .t{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{display:block;font-size:12px;color:var(--muted)}
.item .a{flex:none;font:600 14px var(--font-num);text-align:right}
.listbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mv{display:flex;gap:4px;flex:none}
.mv button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0;font-size:13px}
.mv button:disabled{opacity:.3}
.star{color:var(--up);font-size:.85em}
.mgl{font-weight:650;color:var(--muted)}.mgl.pr{color:var(--up-ink)}
.mv .grip{display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.arow{position:relative;background:var(--surface);transition:transform .16s ease}
.arow.dragging{z-index:6;transition:none;box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:14px;border-top-color:transparent;background:var(--surface2)}
.arow.dragging .grip{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.listbox.dragbox{overflow:visible}
body.dragmode{-webkit-user-select:none;user-select:none;cursor:grabbing}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--up-bg);color:var(--up-ink);font-size:14px}
.nudge .sp{flex:1;min-width:160px}
.nudge button{border:0;background:none;padding:4px 6px;font-weight:700;color:inherit;text-decoration:underline}
.hello h2,.card h2{margin:0 0 10px;font:700 17px/1.25 var(--font-num)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat .lbl{font-size:11px;display:block}
.stat b{display:block;font:700 17px var(--font-num);margin-top:2px}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 4px;text-align:left;border-top:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.tbl td.n{font-family:var(--font-num);text-align:right}
/* timer */
.timer{position:absolute;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:35;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.kb .timer{bottom:12px}
.timer .tm{flex:1;font:700 24px var(--font-num);letter-spacing:.02em}
.timer .tl{font-size:11px;opacity:.7;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.timer button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.16);color:inherit;font-weight:700}
.timer.done{background:var(--accent);color:var(--accent-ink)}
.timer .bar{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 16px 16px;margin:0;background:rgba(255,255,255,.18)}
.timer .bar i{background:currentColor;transition:width .25s linear}
/* toast & sheet */
.toast{position:absolute;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;margin:0 auto;max-width:528px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .28s cubic-bezier(.34,1.4,.64,1)}
.kb .toast{bottom:14px}
#shell.rt .toast{bottom:calc(140px + env(safe-area-inset-bottom))}
.kb #shell.rt .toast,.kb.rt .toast{bottom:80px}
.toast span{flex:1;min-width:0}
.toast button{flex:none;border:0;background:none;padding:4px 6px;font-weight:700;color:var(--accent-soft);text-decoration:underline}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.sheet-root{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(6,14,16,.5);animation:fade .2s ease-out}
.sheet{position:relative;width:min(100%,560px);max-height:94%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.25,1.05);overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{margin:0;font:700 20px var(--font-num);flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.pop-root{align-items:center;padding:0 24px}
.pop{position:relative;width:min(100%,340px);background:var(--surface);border-radius:24px;padding:26px 22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .38s cubic-bezier(.34,1.56,.64,1) both}
.pop h2{margin:14px 0 2px;font:700 20px var(--font-num)}
.pop .pbig{font:800 44px/1.1 var(--font-num);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.pop .pbig.ok{color:var(--ok-ink,var(--accent))}.pop .pbig.over{color:var(--up-ink)}
.pop p{margin:0 0 16px;color:var(--muted);font-size:14px}
.pop .btnrow{display:flex;gap:10px}.pop .btnrow .btn{flex:1}
.pop .tick{width:64px;height:64px;display:block;margin:0 auto;animation:tickpop .5s .12s cubic-bezier(.34,1.56,.64,1) both}
.pop .tick circle{fill:var(--accent);}
.pop .tick path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .38s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
@keyframes tickpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.field{min-width:0}
.field input{box-sizing:border-box;min-width:0;max-width:100%;display:block}
.field input[type=time],.field input[type=date]{-webkit-appearance:none;appearance:none;text-align:center;line-height:1.2}
.field input[type=time]::-webkit-date-and-time-value{text-align:center;margin:0}
.sheet .note+.two{margin-top:16px}
.sheet .warnbox{margin:0 0 14px}
.sheet .two+.warnbox{margin-top:2px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .sub{display:block;font-size:12px;color:var(--muted)}
.setrow select{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:4px 10px;font-size:16px}
.sect{margin:6px 0 8px;font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--up-bg);color:var(--up-ink);font-size:13px}
.wrow.skipped .wn,.wrow.skipped .wt{text-decoration:line-through;text-decoration-thickness:1px;opacity:.6}
.chip.skip{background:var(--skip-bg);border:1px dashed var(--skip);color:var(--skip-ink)}
.sesscard .bigclock{font-size:44px;font-weight:700;line-height:1.1;margin:4px 0 10px;letter-spacing:.01em}
.bigclock.ok{color:var(--ok-ink)}.bigclock.near{color:var(--up-ink)}.bigclock.over{color:var(--low-ink)}
.bar>i.near{background:var(--up)}.bar>i.over{background:var(--low)}
.choice h2{margin:0 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cwd{text-align:center;font-size:11px;font-weight:650;color:var(--muted)}
.cd{aspect-ratio:1;min-width:0;display:grid;place-items:center;align-content:center;gap:0;padding:0;border-radius:12px;border:1.5px solid transparent;background:var(--bg);color:var(--ink)}
.cd b{font-size:13px;line-height:1.1}
.cd small{font:700 10px/1.1 var(--font-num);min-height:11px;color:var(--muted)}
.cd.out{opacity:.35}
.cd.today{border-color:var(--accent)}
.cd.g{background:var(--accent);color:var(--accent-ink)}
.cd.g small{color:inherit}
.cd.g0{border:1.5px dashed var(--accent)}
.cd.r{background:var(--surface2)}
/* calisthenics */
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.prio button{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:700 16px var(--font);color:var(--ink)}
.prio button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice .cgrid .wide{grid-column:1/-1}
.dayrow .seg{width:204px;grid-template-columns:repeat(3,1fr)}
.dayrow .seg button[data-v="cali"][aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cd.c{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cd.c small{color:inherit}
.cd.c0{border:1.5px dashed var(--accent);color:var(--accent)}
.cali .routine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.cali .cmv{background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center;min-width:0}
.cali .cmv b{display:block;font:700 28px/1 var(--font-num)}
.cali .cmv span{display:block;font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.cali .crow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.cali .bigclock{font-size:52px;font-weight:700;line-height:1;letter-spacing:.01em;margin:4px 0 0}
.cali .bigclock.over{color:var(--low-ink)}.cali .bigclock.near{color:var(--up-ink)}.cali .bigclock.idle{color:var(--ink)}
.cali .rcount{text-align:right;flex:none}
.cali .rcount b{display:block;font:800 52px/1 var(--font-num);color:var(--accent)}
.cali .rcount b.bump{animation:bump .26s ease}
.cali .rcount span{font-size:12px;color:var(--muted);font-weight:600}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.lapbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:104px;margin-top:14px;border:0;border-radius:22px;background:var(--accent);color:var(--accent-ink);font:800 30px var(--font-num);letter-spacing:.01em;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;box-shadow:0 8px 22px rgba(14,124,134,.28);transition:transform .08s ease}
.lapbtn:active{transform:scale(.97)}
.lapbtn.go{min-height:76px;font-size:24px}
.lapbtn:disabled{opacity:.45;box-shadow:none}
.cali .btnrow{margin-top:10px}
.cali .btnrow .btn{min-width:0;padding:0 6px;font-size:14px;white-space:nowrap}
.cali .rstep{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;margin-top:14px}
.cali .rstep .iconbtn{width:52px;height:52px;border-radius:16px;font:700 26px var(--font-num);color:var(--ink)}
.cali .rstep .mid{text-align:center}
.cali .rstep .mid b{display:block;font:800 46px/1 var(--font-num);color:var(--accent)}
.cali .rstep .mid span{font-size:12px;color:var(--muted);font-weight:600}
.laps{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line);max-height:230px;overflow:auto}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.laps li span:nth-child(2){font-weight:700}.laps li span:nth-child(3){color:var(--muted);min-width:46px;text-align:right}
.lapsh{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cali .best{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--up-bg);color:var(--up-ink);font-size:13px;font-weight:650}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

var rest = null, restIv = null, audioCtx = null;

      g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.22);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.25);
